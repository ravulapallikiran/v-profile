on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  maven-build:
    name: Clone Repository and Maven Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the GitHub repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Check Java version
      - name: Check Java Version
        run: java -version

      # Step 4: Check Maven version
      - name: Check Maven Version
        run: mvn -version

      # Step 5: Clean previous build files
      - name: Maven Clean
        run: mvn clean

      # Step 6: Compile source code
      - name: Maven Compile
        run: mvn compile

      # Step 7: Run unit tests
      - name: Maven Test
        run: mvn test

      # Step 8: Package application
      - name: Maven Build
        run: mvn package

      # Step 9: Display generated artifacts
      - name: List Build Artifacts
        run: ls -lh target/

      # Step 10: Upload Maven Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-artifact
          path: target/*.war
          retention-days: 7
